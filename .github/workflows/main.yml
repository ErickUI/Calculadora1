name: CI/CD - Calculadora HTML JavaScript

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          
      - name: Instalar dependencias
        run: npm install
        
      - name: Validar HTML
        run: npm run lint:html
        
      - name: Validar JavaScript
        run: npm run check:js
        
      - name: Ejecutar pruebas
        run: npm test
        
      - name: Preparar artefacto
        run: npm run build
        
      - name: Publicar artefacto del build
        uses: actions/upload-artifact@v4
        with:
          name: sitio-web
          path: dist/

  
  deploy-aws:
    needs: build-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Descargar artefacto del build
        uses: actions/download-artifact@v4
        with:
          name: sitio-web
          path: dist/

      - name: Configurar credenciales de AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Guardar y desplegar en AWS S3
        run: aws s3 sync dist/ s3://calculadora-tarea --delete
